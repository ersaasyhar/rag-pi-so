[project]
name = "rag-pi-so"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=0.26.0",
    "fastembed>=0.3.0",
    "fpdf2>=2.7.0",
    "huggingface-hub>=0.23.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26.0",
    "pageindex>=0.2.21",
    "peft>=0.10.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31.0",
    "sentence-transformers>=3.0.0",
    "tabulate>=0.9.0",
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]
